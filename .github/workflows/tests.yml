name: ENTRAP tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          python -m pip install -e .
      - name: Confirm Leiden backend
        run: |
          python - <<'PY'
          import igraph, leidenalg
          print("igraph", igraph.__version__)
          print("leidenalg", leidenalg.__version__)
          PY
      - name: Run tests, including real Leiden integration tests
        run: python -m pytest -ra
